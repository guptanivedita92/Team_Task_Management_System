services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ttms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your .env file}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend/TaskManagement.Api
    container_name: ttms-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagementDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Issuer: "TaskManagementApi"
      Jwt__Audience: "TaskManagementClient"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in your .env file (32+ characters)}"
      Jwt__ExpiryMinutes: "60"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:5000/api"
    container_name: ttms-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
